<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Administrativo</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --azul-principal: #1F63B7;
            --azul-turquesa: #1DB7C9;
            --azul-escuro: #184E92;
            --cinza-claro: #F4F7FA;
            --branco: #FFFFFF;
            --gradiente: linear-gradient(135deg, var(--azul-principal), var(--azul-turquesa));
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body {
            background: var(--cinza-claro);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .login-container {
            background: var(--branco);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .login-logo {
            font-family: 'Poppins', sans-serif;
            font-size: 1.8rem;
            color: var(--azul-escuro);
            margin-bottom: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }
        .login-logo i { color: var(--azul-turquesa); }
        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.9rem;
            font-weight: 500;
            color: #555;
        }
        .input-wrapper {
            position: relative;
        }
        .input-wrapper i {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #aaa;
        }
        .input-wrapper input {
            width: 100%;
            padding: 12px 12px 12px 40px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            outline: none;
            font-size: 1rem;
        }
        .input-wrapper input:focus {
            border-color: var(--azul-principal);
        }
        .btn-login {
            width: 100%;
            padding: 14px;
            background: var(--gradiente);
            color: white;
            border: none;
            border-radius: 8px;
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(31, 99, 183, 0.2);
            transition: all 0.3s ease;
            margin-top: 10px;
        }
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(31, 99, 183, 0.3);
        }
        .error-msg {
            color: #dc2626;
            font-size: 0.85rem;
            margin-top: 15px;
            display: none;
        }
        .back-link {
            display: inline-block;
            margin-top: 20px;
            font-size: 0.9rem;
            color: var(--azul-principal);
            text-decoration: none;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="login-logo">
            <i class="fa-solid fa-users-viewfinder"></i> Visão Coletiva
        </div>
        
        <form id="login-form">
            <div class="form-group">
                <label for="username">Usuário Administrador</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-user"></i>
                    <input type="text" id="username" required placeholder="Ex: admin">
                </div>
            </div>
            
            <div class="form-group">
                <label for="password">Senha de Acesso</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="password" required placeholder="••••••••">
                </div>
            </div>

            <button type="submit" class="btn-login">Entrar no Painel</button>
            <div class="error-msg" id="error-msg">Usuário ou senha incorretos!</div>
        </form>

        <a href="index.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Voltar ao Portal</a>
    </div>

    <script>
        document.getElementById('login-form').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value;
            const errorMsg = document.getElementById('error-msg');

            // Autenticação simples local
            if (user === 'admin' && pass === 'gremio2026') {
                // Registra o login apenas para a sessão atual do navegador
                sessionStorage.setItem('gre_admin_logado', 'true');
                window.location.href = 'admin.html';
            } else {
                errorMsg.style.display = 'block';
                document.getElementById('password').value = '';
            }
        });
    </script>
</body>
</html>
