<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <!-- TRAVA DE SEGURANÇA: Bloqueia visualização se não estiver logado -->
    <script>
        if (sessionStorage.getItem('gre_admin_logado') !== 'true') {
            alert('Acesso negado! Por favor, faça login primeiro.');
            window.location.href = 'login.html';
        }
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo - Grêmio Estudantil</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        /* Estilos complementares específicos do layout do Painel */
        .admin-header {
            background: var(--branco);
            padding: 15px 20px;
            box-shadow: var(--sombra);
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border-radius: 8px;
        }
        .admin-box {
            background: var(--branco);
            padding: 30px;
            border-radius: var(--borda-raio);
            box-shadow: var(--sombra);
            margin-bottom: 40px;
        }
        .admin-form-group {
            margin-bottom: 15px;
        }
        .admin-form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
        }
        .admin-form-group input, .admin-form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }
    </style>
</head>
<body style="padding-top: 20px;">

    <div class="container">
        <!-- Barra superior administrativa -->
        <div class="admin-header">
            <div>
                <h2><i class="fa-solid fa-user-gear"></i> Painel de Controle Administrativo</h2>
                <p style="color: var(--texto-claro); font-size: 0.9rem;">Gerenciamento de conteúdos e ouvidoria</p>
            </div>
            <div style="display: flex; gap: 10px; align-items: center;">
                <a href="index.html" class="btn btn-outline" style="padding: 8px 16px; font-size: 0.9rem;"><i class="fa-solid fa-eye"></i> Ver Site</a>
                <button onclick="fazerLogout()" class="btn-logout"><i class="fa-solid fa-arrow-right-from-bracket"></i> Sair</button>
            </div>
        </div>

        <!-- Exemplo de Bloco de Postagem (Notícias) -->
        <div class="admin-box">
            <h3><i class="fa-solid fa-bullhorn"></i> Publicar Nova Notícia</h3>
            <hr style="margin: 15px 0; border: 0; border-top: 1px solid #eee;">
            <form id="form-nova-noticia">
                <div class="admin-form-group">
                    <label>Título da Notícia</label>
                    <input type="text" id="noticia-titulo" required placeholder="Ex: Grêmio consegue novos computadores para a biblioteca">
                </div>
                <div class="admin-form-group">
                    <label>Texto Descritivo</label>
                    <textarea id="noticia-texto" rows="3" required placeholder="Escreva os detalhes da notícia aqui..."></textarea>
                </div>
                <div class="admin-form-group">
                    <label>Foto do Evento (Opcional)</label>
                    <input type="file" id="noticia-foto" accept="image/*">
                </div>
                <button type="submit" class="btn">Publicar no Portal</button>
            </form>
        </div>
    </div>

    <script>
        // Função de encerramento de sessão segura
        function fazerLogout() {
            if (confirm("Deseja realmente sair da conta administrativa?")) {
                sessionStorage.removeItem('gre_admin_logado');
                window.location.href = 'login.html';
            }
        }

        // Lógica para interceptar o formulário, converter imagem para Base64 e salvar no LocalStorage
        document.getElementById('form-nova-noticia')?.addEventListener('submit', function(e) {
            e.preventDefault();
            
            const titulo = document.getElementById('noticia-titulo').value.trim();
            const texto = document.getElementById('noticia-texto').value.trim();
            const fotoInput = document.getElementById('noticia-foto');
            const dataHoje = new Date().toISOString().split('T')[0]; // Salva no padrão AAAA-MM-DD

            const salvarNoticia = (fotoBase64 = "") => {
                const novaNoticia = { titulo, texto, data: dataHoje, foto: fotoBase64 };
                let noticiasAtuais = JSON.parse(localStorage.getItem('gre_noticias')) || [];
                
                noticiasAtuais.unshift(novaNoticia); // Adiciona no início da lista
                localStorage.setItem('gre_noticias', JSON.stringify(noticiasAtuais));
                
                alert("Notícia publicada com sucesso! Ela já está visível na página inicial.");
                this.reset();
            };

            if (fotoInput.files && fotoInput.files[0]) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    salvarNoticia(event.target.result); // Grava a string comprimida da foto
                };
                reader.readAsDataURL(fotoInput.files[0]);
            } else {
                salvarNoticia();
            }
        });
    </script>
</body>
</html>
