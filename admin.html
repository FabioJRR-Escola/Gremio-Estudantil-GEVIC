<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo | Grêmio Visão Coletiva</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .admin-container { max-width: 900px; margin: 40px auto; padding: 0 20px; }
        .admin-card { background: white; border: 1px solid var(--border-color); border-radius: 8px; padding: 25px; margin-bottom: 30px; box-shadow: 0 4px 6px rgba(0,0,0,0.02); }
        .admin-card h2 { margin-bottom: 20px; color: var(--color-primary); font-size: 1.4rem; border-bottom: 2px solid var(--color-accent); padding-bottom: 8px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-weight: 600; margin-bottom: 5px; font-size: 0.9rem; }
        .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 4px; font-size: 0.95rem; }
        .form-group textarea { resize: vertical; height: 90px; }
        .btn-save { background: var(--color-primary); color: white; border: none; padding: 10px 20px; font-weight: bold; border-radius: 4px; cursor: pointer; }
        .btn-save:hover { background: var(--color-accent); }
        .back-link { display: inline-block; margin-bottom: 20px; font-weight: 600; color: var(--color-primary); }
        .item-list { margin-top: 15px; border-top: 1px solid var(--border-color); padding-top: 15px; }
        .item-row { display: flex; justify-content: space-between; align-items: center; background: #f8fafc; padding: 10px 15px; border-radius: 4px; margin-bottom: 8px; border: 1px solid var(--border-color); font-size: 0.9rem; }
        .btn-del { background: #ef4444; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 0.8rem; }
    </style>
</head>
<body>
    <div class="admin-container">
        <a href="index.html" class="back-link">← Voltar para o Site Principal</a>
        <h1>Painel de Controle Administrativo</h1>
        <p style="margin-bottom: 30px; color: #64748b;">Gerencie os conteúdos, diretoria, agenda e anexos do portal do Grêmio.</p>

        <!-- GERENCIAR NOTÍCIAS -->
        <div class="admin-card">
            <h2>Adicionar Notícia / Comunicado</h2>
            <form id="form-noticia">
                <div class="form-group"><label>Título:</label><input type="text" id="noticia-titulo" required></div>
                <div class="form-group"><label>Categoria (Ex: Aviso, Projeto):</label><input type="text" id="noticia-categoria" required></div>
                <div class="form-group"><label>Data:</label><input type="date" id="noticia-data"></div>
                <div class="form-group"><label>Conteúdo:</label><textarea id="noticia-conteudo" required></textarea></div>
                <div class="form-group"><label>Link de Anexo / Documento (Opcional):</label><input type="url" id="noticia-anexo" placeholder="https://exemplo.com/arquivo.pdf"></div>
                <button type="submit" class="btn-save">Cadastrar Notícia</button>
            </form>
            <div class="item-list" id="lista-noticias"></div>
        </div>

        <!-- GERENCIAR EVENTOS -->
        <div class="admin-card">
            <h2>Adicionar Evento na Agenda</h2>
            <form id="form-evento">
                <div class="form-group"><label>Título do Evento:</label><input type="text" id="evento-titulo" required></div>
                <div class="form-group"><label>Data:</label><input type="date" id="evento-data" required></div>
                <div class="form-group"><label>Local:</label><input type="text" id="evento-local" required></div>
                <div class="form-group"><label>Descrição Completa:</label><textarea id="evento-descricao"></textarea></div>
                <div class="form-group"><label>Link de Anexo / Inscrição (Opcional):</label><input type="url" id="evento-anexo" placeholder="https://exemplo.com/inscricao"></div>
                <button type="submit" class="btn-save">Cadastrar Evento</button>
            </form>
            <div class="item-list" id="lista-eventos"></div>
        </div>

        <!-- GERENCIAR MEMBROS -->
        <div class="admin-card">
            <h2>Adicionar Membro da Diretoria</h2>
            <form id="form-membro">
                <div class="form-group"><label>Nome Completo:</label><input type="text" id="membro-nome" required></div>
                <div class="form-group"><label>Cargo (Ex: Presidente, Tesoureiro):</label><input type="text" id="membro-cargo" required></div>
                <div class="form-group"><label>Breve Descrição / Bio (Opcional):</label><input type="text" id="membro-bio"></div>
                <button type="submit" class="btn-save">Cadastrar Membro</button>
            </form>
            <div class="item-list" id="lista-membros"></div>
        </div>
    </div>

    <script>
        function carregarDadosAdmin() {
            // Notícias
            const noticias = JSON.parse(localStorage.getItem('gremio_noticias')) || [];
            document.getElementById('lista-noticias').innerHTML = noticias.map((n, i) => `
                <div class="item-row">
                    <span><strong>${n.titulo}</strong> (${n.categoria})</span>
                    <button class="btn-del" onclick="removerItem('gremio_noticias', ${i})">Excluir</button>
                </div>
            `).join('') || '<p style="font-size:0.85rem; color:#64748b;">Nenhuma notícia cadastrada.</p>';

            // Eventos
            const eventos = JSON.parse(localStorage.getItem('gremio_eventos')) || [];
            document.getElementById('lista-eventos').innerHTML = eventos.map((e, i) => `
                <div class="item-row">
                    <span><strong>${e.titulo}</strong> - ${e.data}</span>
                    <button class="btn-del" onclick="removerItem('gremio_eventos', ${i})">Excluir</button>
                </div>
            `).join('') || '<p style="font-size:0.85rem; color:#64748b;">Nenhum evento cadastrado.</p>';

            // Membros
            const membros = JSON.parse(localStorage.getItem('gremio_membros')) || [];
            document.getElementById('lista-membros').innerHTML = membros.map((m, i) => `
                <div class="item-row">
                    <span><strong>${m.nome}</strong> - ${m.cargo}</span>
                    <button class="btn-del" onclick="removerItem('gremio_membros', ${i})">Excluir</button>
                </div>
            `).join('') || '<p style="font-size:0.85rem; color:#64748b;">Nenhum membro cadastrado.</p>';
        }

        function removerItem(chave, index) {
            let dados = JSON.parse(localStorage.getItem(chave)) || [];
            dados.splice(index, 1);
            localStorage.setItem(chave, JSON.stringify(dados));
            carregarDadosAdmin();
        }

        document.getElementById('form-noticia').addEventListener('submit', (e) => {
            e.preventDefault();
            const noticias = JSON.parse(localStorage.getItem('gremio_noticias')) || [];
            noticias.push({
                titulo: document.getElementById('noticia-titulo').value,
                categoria: document.getElementById('noticia-categoria').value,
                data: document.getElementById('noticia-data').value,
                conteudo: document.getElementById('noticia-conteudo').value,
                anexo: document.getElementById('noticia-anexo').value
            });
            localStorage.setItem('gremio_noticias', JSON.stringify(noticias));
            e.target.reset();
            carregarDadosAdmin();
            alert('Notícia adicionada com sucesso!');
        });

        document.getElementById('form-evento').addEventListener('submit', (e) => {
            e.preventDefault();
            const eventos = JSON.parse(localStorage.getItem('gremio_eventos')) || [];
            eventos.push({
                titulo: document.getElementById('evento-titulo').value,
                data: document.getElementById('evento-data').value,
                local: document.getElementById('evento-local').value,
                descricao: document.getElementById('evento-descricao').value,
                anexo: document.getElementById('evento-anexo').value
            });
            localStorage.setItem('gremio_eventos', JSON.stringify(eventos));
            e.target.reset();
            carregarDadosAdmin();
            alert('Evento adicionado com sucesso!');
        });

        document.getElementById('form-membro').addEventListener('submit', (e) => {
            e.preventDefault();
            const membros = JSON.parse(localStorage.getItem('gremio_membros')) || [];
            membros.push({
                nome: document.getElementById('membro-nome').value,
                cargo: document.getElementById('membro-cargo').value,
                bio: document.getElementById('membro-bio').value
            });
            localStorage.setItem('gremio_membros', JSON.stringify(membros));
            e.target.reset();
            carregarDadosAdmin();
            alert('Membro adicionado com sucesso!');
        });

        carregarDadosAdmin();
    </script>
</body>
</html>
